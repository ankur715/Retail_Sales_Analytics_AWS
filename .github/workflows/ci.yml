name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: none   # no LLM calls in CI; tests that need one fake it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (no AWS, no Gemini -- S3 is moto, Redshift and Gemini calls are faked, APIs use TestClient)
        run: pytest -q tests
      - name: gRPC stubs match sqlgen.proto (regenerate with the command in its header)
        run: |
          python -m grpc_tools.protoc -I . --python_out=. --pyi_out=. --grpc_python_out=. sqlgen/sqlgen.proto
          git diff --exit-code -- sqlgen/

  migration-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needs the base branch to diff against
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary python-dotenv
      - name: No edited applied migrations, no unannotated drops / renames / unbounded deletes
        env:
          # PRs compare with their target branch; pushes with the commit before the push
          MIGRATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python -m scripts.check_migrations

  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SLO rules parse, and their promtool unit tests pass (burn-rate alerts fire when they should)
        run: |
          docker run --rm -v "$PWD/observability:/obs" --entrypoint promtool prom/prometheus:v2.55.1 check rules /obs/rules/slo.yml
          docker run --rm -v "$PWD/observability:/obs" -w /obs/rules --entrypoint promtool prom/prometheus:v2.55.1 test rules slo_test.yml

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy/k8s renders (as Argo CD builds it) and every object matches the Kubernetes 1.31 schemas
        run: |
          kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary \
            -kubernetes-version 1.31.2 /w/rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 -summary -ignore-missing-schemas \
            /w/deploy/argocd/application.yaml /w/deploy/argocd/argocd-cm.yaml

  ai-integration:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: none
      PG_TEST_DSN: postgresql://postgres:ci-local@localhost:5432/retail_dev
      PG_READER_DSN: postgresql://chat_reader:ci-reader@localhost:5432/retail_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Postgres + pgvector, seeded with the chat views (the same init scripts as docker-compose)
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_DB=retail_dev -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=ci-local -e CHAT_READER_PASSWORD=ci-reader \
            -v "$PWD/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro" pgvector/pgvector:0.8.0-pg16
          for i in $(seq 1 60); do
            docker exec pg psql -U postgres -d retail_dev -tAc "SELECT count(*) FROM chat.v_calendar" 2>/dev/null && break
            sleep 2
          done
      - name: Examples and eval reference SQL run; RAG index builds and retrieves (access-filtered); eval smoke
        run: pytest -q tests/integration

  # --- security scans (milestone 4) ---------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every commit, not just the latest tree
      - name: gitleaks -- no secrets anywhere in git history (allowlist in .gitleaks.toml)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact --verbose

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit==1.8.0
      - name: bandit -- medium+ severity at medium+ confidence fails (generated gRPC stubs excluded)
        run: bandit -q -r chatbot etl sqlgen triage mock_api scripts chaos data_gen airflow/dags -x '*_pb2*.py' -ll -ii

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy repo scan -- Dockerfile + Kubernetes misconfig, leaked secrets, pinned dependencies
        run: |
          docker run --rm -v "$PWD:/repo" -v trivy-cache:/root/.cache aquasec/trivy:0.57.1 fs /repo \
            --scanners misconfig,secret,vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /repo/.venv --ignorefile /repo/.trivyignore
      - name: Trivy image scan -- the chatbot/sqlgen image as built (OS packages + installed Python packages)
        run: |
          docker build -q -t retail-chatbot:ci -f docker/chatbot.Dockerfile .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.57.1 image retail-chatbot:ci \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /.trivyignore

  dag-tests:
    runs-on: ubuntu-latest
    env:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      RETAIL_ENV: dev
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Airflow (constraint-pinned) + project deps
        working-directory: airflow
        run: pip install -r requirements.txt
      - name: DAG integrity -- one DAG per pipeline in config/pipeline_config.csv (no Redshift needed)
        working-directory: airflow
        run: |
          export AIRFLOW_HOME="$RUNNER_TEMP/airflow_home"
          export AIRFLOW__CORE__DAGS_FOLDER="$(pwd)/dags"
          airflow db migrate
          pytest -q tests

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt + validate (no AWS credentials needed)
        working-directory: infra/terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false
          terraform validate
