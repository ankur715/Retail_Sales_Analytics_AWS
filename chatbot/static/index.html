<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Sales Chatbot</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --border: #dfe3ea;
    --accent: #2f5bea; --accent-text: #ffffff; --user: #e8eefd; --code: #f1f3f7; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --border: #2c3340;
      --accent: #6d8cff; --accent-text: #0d1220; --user: #22304f; --code: #232a35; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 140px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 16px;
          padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .msg { margin: 14px 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
         background: var(--panel); }
  .msg.user { background: var(--user); border-color: transparent; margin-left: 15%; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .err { color: var(--err); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12.5px;
        white-space: pre-wrap; }
  .table-wrap { overflow-x: auto; margin-top: 8px; max-height: 320px; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  th, td { border-bottom: 1px solid var(--border); padding: 5px 8px; text-align: left; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border);
         padding: 12px 16px; }
  .bar { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
          background: var(--panel); color: var(--text); font-size: 15px; }
  button[type=submit] { padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent);
                        color: var(--accent-text); font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .who { display: none; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .who.on { display: flex; }
  .who button { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px;
                padding: 3px 10px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Retail Sales Chatbot</h1>
  <div class="who" id="who"><span id="whoami"></span><button type="button" id="logout">Sign out</button></div>
  <div class="sub" id="status">Ask about weekly sales and inventory by brand, retailer and product.</div>
  <div class="chips" id="chips"></div>
  <div id="log"></div>
</main>
<form id="form">
  <div class="bar">
    <input id="q" placeholder="e.g. Total sales by retailer last week" autocomplete="off" maxlength="500">
    <button type="submit" id="send">Ask</button>
  </div>
</form>
<script src="/static/app.js"></script>
</body>
</html>
