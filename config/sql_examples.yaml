# Solved example questions for retrieval (milestone 5). Per question, the chatbot retrieves the
# few most similar examples that only use the routed views and shows them to the model as
# guidance (rag/). Reviewed in PRs like the catalog. Every SQL here must pass the SQL guard
# (tests/test_rag.py) and run on the Postgres copy of the chat views (CI job ai-integration).
#
# Keep these DIFFERENT from the evaluation questions (evals/questions.yaml), or the eval
# measures copying, not answering. tests/test_rag.py checks there's no overlap.
examples:
  # --- chat.v_sales_by_week: totals, trends, comparisons --------------------------------------
  - question: "What were total sales across all brands in the latest week?"
    views: [chat.v_sales_by_week]
    sql: "SELECT ROUND(SUM(sales_usd), 2) AS total_sales_usd FROM chat.v_sales_by_week WHERE weeks_ago = 0"
  - question: "Weekly sales trend for Bramble Footwear over the last 8 weeks"
    views: [chat.v_sales_by_week]
    sql: "SELECT week_ending, ROUND(SUM(sales_usd), 2) AS sales_usd FROM chat.v_sales_by_week WHERE brand = 'Bramble Footwear' AND weeks_ago BETWEEN 0 AND 7 GROUP BY week_ending ORDER BY week_ending"
  - question: "Which brand had the highest sales over the last 4 weeks?"
    views: [chat.v_sales_by_week]
    sql: "SELECT brand, ROUND(SUM(sales_usd), 2) AS sales_usd FROM chat.v_sales_by_week WHERE weeks_ago BETWEEN 0 AND 3 GROUP BY brand ORDER BY sales_usd DESC LIMIT 1"
  - question: "Sales by brand and retailer for the last 4 weeks"
    views: [chat.v_sales_by_week]
    sql: "SELECT brand, retailer, ROUND(SUM(sales_usd), 2) AS sales_usd FROM chat.v_sales_by_week WHERE weeks_ago BETWEEN 0 AND 3 GROUP BY brand, retailer ORDER BY brand, sales_usd DESC"
  - question: "Which retailer grew the most week over week for Cobalt Outdoor?"
    views: [chat.v_sales_by_week]
    sql: "SELECT retailer, week_ending, ROUND(wow_change_usd, 2) AS wow_change_usd, ROUND(wow_change_pct, 2) AS wow_change_pct FROM chat.v_sales_by_week WHERE brand = 'Cobalt Outdoor' AND wow_change_usd IS NOT NULL ORDER BY wow_change_usd DESC LIMIT 1"
  - question: "Biggest week-over-week sales drops in the latest week"
    views: [chat.v_sales_by_week]
    sql: "SELECT brand, retailer, ROUND(wow_change_usd, 2) AS wow_change_usd, ROUND(wow_change_pct, 2) AS wow_change_pct FROM chat.v_sales_by_week WHERE weeks_ago = 0 AND wow_change_usd < 0 ORDER BY wow_change_usd ASC"
  - question: "Average weekly sales per retailer for Aurora Apparel"
    views: [chat.v_sales_by_week]
    sql: "SELECT retailer, ROUND(AVG(sales_usd), 2) AS avg_weekly_sales_usd, COUNT(*) AS weeks FROM chat.v_sales_by_week WHERE brand = 'Aurora Apparel' GROUP BY retailer ORDER BY avg_weekly_sales_usd DESC"
  - question: "Current inventory on hand by brand at Harbor Mart"
    views: [chat.v_sales_by_week]
    sql: "SELECT s.brand, s.inventory_units, s.week_ending FROM chat.v_sales_by_week s WHERE s.retailer = 'Harbor Mart' AND s.week_ending = (SELECT MAX(week_ending) FROM chat.v_sales_by_week WHERE retailer = 'Harbor Mart' AND brand = s.brand) ORDER BY s.brand"
  - question: "How many products were out of stock per retailer in the latest week?"
    views: [chat.v_sales_by_week]
    sql: "SELECT retailer, SUM(products_out_of_stock) AS products_out_of_stock, SUM(products_reported) AS products_reported FROM chat.v_sales_by_week WHERE weeks_ago = 0 GROUP BY retailer ORDER BY products_out_of_stock DESC"
  - question: "Compare Northgate Department Stores sales this week to the same week last month"
    views: [chat.v_sales_by_week]
    sql: "SELECT SUM(CASE WHEN weeks_ago = 0 THEN sales_usd END) AS this_week_usd, SUM(CASE WHEN weeks_ago = 4 THEN sales_usd END) AS four_weeks_ago_usd FROM chat.v_sales_by_week WHERE retailer = 'Northgate Department Stores' AND weeks_ago IN (0, 4)"

  # --- chat.v_weekly_sales: products, styles, colors, sizes ------------------------------------
  - question: "Best-selling color for Aurora Apparel over the last 4 weeks"
    views: [chat.v_weekly_sales]
    sql: "SELECT color, ROUND(SUM(sales_usd), 2) AS sales_usd FROM chat.v_weekly_sales WHERE brand = 'Aurora Apparel' AND color IS NOT NULL AND weeks_ago BETWEEN 0 AND 3 GROUP BY color ORDER BY sales_usd DESC"
  - question: "Sales by size for Bramble Footwear last week"
    views: [chat.v_weekly_sales]
    sql: "SELECT size, ROUND(SUM(sales_usd), 2) AS sales_usd FROM chat.v_weekly_sales WHERE brand = 'Bramble Footwear' AND size IS NOT NULL AND weeks_ago = 0 GROUP BY size ORDER BY sales_usd DESC"
  - question: "Bottom 3 products by sales at Summit Outfitters in the last 4 weeks"
    views: [chat.v_weekly_sales]
    sql: "SELECT brand, product_name, ROUND(SUM(sales_usd), 2) AS sales_usd FROM chat.v_weekly_sales WHERE retailer = 'Summit Outfitters' AND weeks_ago BETWEEN 0 AND 3 GROUP BY brand, product_name ORDER BY sales_usd ASC LIMIT 3"
  - question: "Which styles sell best for Cobalt Outdoor across all retailers?"
    views: [chat.v_weekly_sales]
    sql: "SELECT style, ROUND(SUM(sales_usd), 2) AS sales_usd FROM chat.v_weekly_sales WHERE brand = 'Cobalt Outdoor' GROUP BY style ORDER BY sales_usd DESC"
  - question: "Products that have been out of stock for 2 or more weeks in the last 4 weeks"
    views: [chat.v_weekly_sales]
    sql: "SELECT brand, retailer, product_name, COUNT(*) AS weeks_out_of_stock FROM chat.v_weekly_sales WHERE weeks_ago BETWEEN 0 AND 3 AND is_out_of_stock GROUP BY brand, retailer, product_name HAVING COUNT(*) >= 2 ORDER BY weeks_out_of_stock DESC, brand"
  - question: "How many units of Rain Shell are on hand at each retailer this week?"
    views: [chat.v_weekly_sales]
    sql: "SELECT retailer, SUM(inventory_units) AS inventory_units FROM chat.v_weekly_sales WHERE product_name LIKE 'Rain Shell%' AND weeks_ago = 0 GROUP BY retailer ORDER BY inventory_units DESC"
  - question: "Number of distinct products each brand sells at Harbor Mart"
    views: [chat.v_weekly_sales]
    sql: "SELECT brand, COUNT(DISTINCT product_id) AS products FROM chat.v_weekly_sales WHERE retailer = 'Harbor Mart' GROUP BY brand ORDER BY brand"
  - question: "Top selling SKU for each brand last week"
    views: [chat.v_weekly_sales]
    sql: "SELECT brand, product_name, sales_usd FROM (SELECT brand, product_name, ROUND(SUM(sales_usd), 2) AS sales_usd, ROW_NUMBER() OVER (PARTITION BY brand ORDER BY SUM(sales_usd) DESC) AS rn FROM chat.v_weekly_sales WHERE weeks_ago = 0 AND product_grain = 'sku' GROUP BY brand, product_name) t WHERE rn = 1 ORDER BY brand"

  # --- chat.v_calendar: named periods ----------------------------------------------------------
  - question: "Total sales in September 2026 by brand"
    views: [chat.v_sales_by_week, chat.v_calendar]
    sql: "SELECT s.brand, ROUND(SUM(s.sales_usd), 2) AS sales_usd FROM chat.v_sales_by_week s JOIN chat.v_calendar c ON c.week_ending = s.week_ending WHERE c.month_name = 'Sep 2026' GROUP BY s.brand ORDER BY sales_usd DESC"
  - question: "Quarterly sales for Cobalt Outdoor"
    views: [chat.v_sales_by_week, chat.v_calendar]
    sql: "SELECT c.year, c.quarter, ROUND(SUM(s.sales_usd), 2) AS sales_usd FROM chat.v_sales_by_week s JOIN chat.v_calendar c ON c.week_ending = s.week_ending WHERE s.brand = 'Cobalt Outdoor' GROUP BY c.year, c.quarter ORDER BY c.year, c.quarter"
  - question: "Which weeks of data do we have?"
    views: [chat.v_calendar]
    sql: "SELECT week_starting, week_ending, weeks_ago FROM chat.v_calendar ORDER BY week_ending"

  # --- chat.v_data_freshness: coverage ---------------------------------------------------------
  - question: "Which brand and retailer pairs are behind the latest week?"
    views: [chat.v_data_freshness]
    sql: "SELECT brand, retailer, latest_week_loaded FROM chat.v_data_freshness WHERE latest_week_loaded < (SELECT MAX(latest_week_loaded) FROM chat.v_data_freshness) ORDER BY latest_week_loaded, brand"
  - question: "When was Bramble Footwear's data last loaded?"
    views: [chat.v_data_freshness]
    sql: "SELECT retailer, latest_week_loaded, last_successful_load_at FROM chat.v_data_freshness WHERE brand = 'Bramble Footwear' ORDER BY retailer"
  - question: "How many weeks of history do we have per retailer?"
    views: [chat.v_data_freshness]
    sql: "SELECT retailer, MIN(first_week_loaded) AS first_week, MAX(latest_week_loaded) AS latest_week, MAX(weeks_loaded) AS weeks_loaded FROM chat.v_data_freshness GROUP BY retailer ORDER BY retailer"
