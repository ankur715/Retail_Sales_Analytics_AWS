# The chatbot stack on Kubernetes (milestone 3), synced by Argo CD from this folder
# (deploy/argocd/application.yaml) into a kind cluster in the Codespace (deploy/kind/up.sh).
# Same code and image as the Compose stack; Redshift and the real LLMs are never involved.
#
# Config files are generated from the files the Compose stack already uses, so there is one
# copy of each. They live outside this folder, which needs kustomize's
# `--load-restrictor LoadRestrictionsNone` (set for Argo CD in deploy/argocd/argocd-cm.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: retail
labels:
  - pairs:
      app.kubernetes.io/part-of: retail-chatbot
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - redpanda.yaml
  - sqlgen.yaml
  - chatbot.yaml
  - prometheus.yaml
  - grafana.yaml
images:
  - name: retail-chatbot          # built in the Codespace and loaded into kind (deploy/kind/up.sh)
    newTag: local
configMapGenerator:
  - name: postgres-initdb
    files:
      - ../../docker/postgres/initdb/00_roles.sh
      - ../../docker/postgres/initdb/10_chat_views.sql
      - ../../docker/postgres/initdb/20_rag.sql
  - name: postgres-seed
    files:
      - ../../docker/postgres/initdb/data/v_calendar.csv
      - ../../docker/postgres/initdb/data/v_data_freshness.csv
      - ../../docker/postgres/initdb/data/v_sales_by_week.csv
      - ../../docker/postgres/initdb/data/v_weekly_sales.csv
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus-k8s.yml
      - ../../observability/rules/slo.yml
  - name: grafana-datasources
    files:
      - ../../observability/grafana/provisioning/datasources/datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - ../../observability/grafana/provisioning/dashboards/dashboards.yaml
  - name: grafana-dashboards
    files:
      - ../../observability/grafana/dashboards/golden_signals.json
      - ../../observability/grafana/dashboards/slo.json
      - ../../observability/grafana/dashboards/llm_cost.json
secretGenerator:
  # Local-only defaults for throwaway pods, the same ones docker-compose.yml uses -- not real
  # credentials. Real secrets come out of git entirely in milestone 4 (Vault / Codespaces secrets).
  - name: retail-local
    literals:
      - POSTGRES_PASSWORD=postgres-local
      - CHAT_READER_PASSWORD=chat-reader-local
      - GRAFANA_ADMIN_PASSWORD=grafana-local
