# Prometheus inside kind: finds the chatbot and sqlgen pods through the Kubernetes API (each
# replica is its own target), and loads the same SLO rules as the Compose stack.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/slo.yml
scrape_configs:
  - job_name: chatbot
    kubernetes_sd_configs: [{ role: pod, namespaces: { names: [retail] } }]
    relabel_configs:
      - { source_labels: [__meta_kubernetes_pod_label_app], regex: chatbot, action: keep }
      - { source_labels: [__meta_kubernetes_pod_container_port_name], regex: http, action: keep }
      - { source_labels: [__meta_kubernetes_pod_phase], regex: Running, action: keep }
      - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
  - job_name: sqlgen
    kubernetes_sd_configs: [{ role: pod, namespaces: { names: [retail] } }]
    relabel_configs:
      - { source_labels: [__meta_kubernetes_pod_label_app], regex: sqlgen, action: keep }
      - { source_labels: [__meta_kubernetes_pod_container_port_name], regex: metrics, action: keep }
      - { source_labels: [__meta_kubernetes_pod_phase], regex: Running, action: keep }
      - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
