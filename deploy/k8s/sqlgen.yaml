# SQL generation (gRPC), two replicas behind a normal ClusterIP Service.
#
# Tried first: a headless Service with client-side round_robin (per-call balancing). The chaos
# test showed why not here: when every sqlgen pod is replaced, DNS (CoreDNS caches 30 s) keeps
# returning the dead pods' IPs, so the chatbot failed for ~30-45 s after sqlgen was already
# back. Through the ClusterIP, kube-proxy routes a reconnect to a live pod within a second or
# two of the endpoints changing. The cost is per-connection balancing: each chatbot's HTTP/2
# connection sticks to one pod until the server ends it after 30 s (sqlgen/server.py), and the
# client reconnects, possibly to another pod. See ADR 0003.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlgen
spec:
  replicas: 2
  selector: { matchLabels: { app: sqlgen } }
  template:
    metadata:
      labels: { app: sqlgen }
    spec:
      # No Docker-link env vars (SQLGEN_PORT=tcp://..., POSTGRES_PORT=...): they collide with real
      # settings -- a Service named sqlgen broke sqlgen's own SQLGEN_PORT.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      containers:
        - name: sqlgen
          image: retail-chatbot
          command: ["python", "-m", "sqlgen.server"]
          ports:
            - { containerPort: 50051, name: grpc }
            - { containerPort: 9101, name: metrics }
          env:
            - { name: ENV, value: dev }
            - { name: LLM_PROVIDER, value: fake }
            - { name: FAKE_LLM_LATENCY_MS, value: "800" }
            - { name: FAKE_LLM_ERROR_RATE, value: "0" }
          readinessProbe:
            tcpSocket: { port: grpc }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sqlgen
spec:
  selector: { app: sqlgen }
  ports: [{ port: 50051, targetPort: grpc, name: grpc }]
