# Local stack for the course milestones; runs in the Codespace, never on the laptop or AWS.
# Start only the profile a task needs:   docker compose --profile app up -d --build
# Stop it when done:                     docker compose --profile app down
#
# app: the chatbot on the fake LLM (no model, no cost), the sqlgen gRPC service it calls to write
#      SQL, a Postgres copy of the chat.* views (seeded by scripts/export_chat_views.py) and Redis
#      (answer cache + Idempotency-Key records).
# obs: OpenTelemetry Collector -> Jaeger (traces), Prometheus (metrics), Grafana (dashboards in
#      observability/). Start both:  docker compose --profile app --profile obs up -d --build
# auth: Keycloak (login, realm in deploy/keycloak/) and Vault in dev mode (the chatbot's DB
#      password). Start with  bash deploy/auth/up.sh  -- it generates the credentials into
#      .secrets/local.env (gitignored) and turns AUTH_MODE=oidc on for the chatbot.
#      (Their credentials default to empty, not `${VAR:?}`: Compose checks every service's
#      variables whatever the profile, so a required one would break `--profile app` too.)
# Passwords below are local-only defaults for throwaway containers, not real credentials.

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16   # Postgres 16 + pgvector (retrieval index, milestone 5)
    ports: ["127.0.0.1:5432:5432"]   # localhost only: rag.ingest and evals.run from the Codespace's .venv
    profiles: ["app"]
    environment:
      POSTGRES_DB: retail_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
      CHAT_READER_PASSWORD: ${CHAT_READER_PASSWORD:-chat-reader-local}
    volumes:
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_dev"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512m }

  redis:
    image: redis:7-alpine
    profiles: ["app"]
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 128m }

  chatbot:
    build: { context: ., dockerfile: docker/chatbot.Dockerfile }
    profiles: ["app"]
    ports: ["8000:8000"]
    environment:
      ENV: dev
      LLM_PROVIDER: fake
      FAKE_LLM_LATENCY_MS: ${FAKE_LLM_LATENCY_MS:-800}
      FAKE_LLM_ERROR_RATE: ${FAKE_LLM_ERROR_RATE:-0}
      REDSHIFT_HOST: postgres
      REDSHIFT_PORT: "5432"
      REDSHIFT_DB: retail_dev
      REDSHIFT_SSLMODE: disable
      CHAT_REDSHIFT_USER: chat_reader
      # With the auth profile this is empty and the password comes from Vault (deploy/auth/up.sh)
      CHAT_REDSHIFT_PASSWORD: ${CHAT_REDSHIFT_PASSWORD_ENV-chat-reader-local}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_SECRET_PATH: secret/retail/chatbot
      VAULT_TOKEN_FILE: /run/vault/chatbot
      AUTH_MODE: ${AUTH_MODE:-off}
      OIDC_ISSUER: http://localhost:8081/realms/retail
      OIDC_JWKS_URL: http://keycloak:8080/realms/retail/protocol/openid-connect/certs
      RAG_ENABLED: ${RAG_ENABLED:-false}      # build the index first: python -m rag.ingest
      RAG_EMBEDDER: ${RAG_EMBEDDER:-hash}
      RAG_DATABASE_URL: postgresql://chat_reader:${CHAT_READER_PASSWORD:-chat-reader-local}@postgres:5432/retail_dev
      REDIS_URL: redis://redis:6379/0
      SQLGEN_ADDR: sqlgen:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      sqlgen: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully, required: false }
    volumes:
      - vault-token:/run/vault:ro
    deploy:
      resources:
        limits: { memory: 512m }

  # SQL generation over gRPC (sqlgen/): the write_sql step, same image, its own process.
  sqlgen:
    build: { context: ., dockerfile: docker/chatbot.Dockerfile }
    profiles: ["app"]
    command: ["python", "-m", "sqlgen.server"]
    environment:
      ENV: dev
      LLM_PROVIDER: fake
      FAKE_LLM_LATENCY_MS: ${FAKE_LLM_LATENCY_MS:-800}
      FAKE_LLM_ERROR_RATE: ${FAKE_LLM_ERROR_RATE:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=2)"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 256m }

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_TEST_USER_PASSWORD: ${KC_TEST_USER_PASSWORD:-}   # substituted into the realm import
      KC_HOSTNAME: http://localhost:8081            # the issuer browsers and tokens use
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"       # ...while the chatbot fetches keys at keycloak:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/realm-retail.json:/opt/keycloak/data/import/realm-retail.json:ro
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 30
    deploy:
      resources:
        limits: { memory: 768m }

  vault:
    image: hashicorp/vault:1.18.3
    profiles: ["auth"]
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-}
    cap_add: [IPC_LOCK]
    deploy:
      resources:
        limits: { memory: 192m }

  vault-init:   # seeds the secret + a read-only token for the chatbot, then exits
    image: hashicorp/vault:1.18.3
    profiles: ["auth"]
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      VAULT_DEV_ROOT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-}
      CHAT_READER_PASSWORD: ${CHAT_READER_PASSWORD:-chat-reader-local}
    volumes:
      - ./deploy/vault/init.sh:/init.sh:ro
      - vault-token:/vault-token
    depends_on: [vault]

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    profiles: ["obs"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]
    deploy:
      resources:
        limits: { memory: 192m }

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["obs"]
    command: ["--memory.max-traces=8000"]   # ~12 spans per trace across two services; 20k OOM-killed it at 384 MB
    ports: ["16686:16686"]
    deploy:
      resources:
        limits: { memory: 384m }

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["obs"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
    ports: ["9090:9090"]
    deploy:
      resources:
        limits: { memory: 256m }

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-local}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # read-only viewing in a private Codespace port
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/golden_signals.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]
    deploy:
      resources:
        limits: { memory: 384m }

  # load: k6, run on demand (see loadtest/chat.js); exits when the test ends.
  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    volumes:
      - ./loadtest:/scripts
    deploy:
      resources:
        limits: { memory: 256m }

volumes:
  vault-token:   # the chatbot's read-only Vault token (written by vault-init)
