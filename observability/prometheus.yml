global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: chatbot
    metrics_path: /metrics
    static_configs:
      - targets: ["chatbot:8000"]
  - job_name: sqlgen          # milestone 2: the write_sql step's metrics live in the sqlgen service
    static_configs:
      - targets: ["sqlgen:9101"]
