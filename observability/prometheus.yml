global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules/slo.yml   # milestone 3: SLO recording rules and burn-rate alerts
scrape_configs:
  - job_name: chatbot
    metrics_path: /metrics
    static_configs:
      - targets: ["chatbot:8000"]
  - job_name: sqlgen          # milestone 2: the write_sql step's metrics live in the sqlgen service
    static_configs:
      - targets: ["sqlgen:9101"]
